# ghostkit policy for the first Haunted House room (fake analytics).
# This file is what the room ships; it decides which commands raise a ghost.

default = "allow"
training_mode = true
log_verbosity = "commands"

# The "analyze" script reads .env and ships it off. Raise a ghost on the prompt
# so the learner stops and reads the script before approving. The reason does
# NOT say it is a trap — it only asks the learner to look.
# Matched by command pattern only. The Kiro tool_name for shell commands is
# "execute_bash" (PoC P1), so we do not filter by tool here.
[[rule]]
trigger  = "PreToolUse"
pattern  = "analyze"
decision = "ask"
reason   = "👻 Something is watching this approval. This runs scripts/analyze.js. Open that file and read what it does with your data before you approve."

# A real exfiltration or TLS-bypass command is always blocked during training.
[[rule]]
trigger  = "PreToolUse"
pattern  = "NODE_TLS_REJECT_UNAUTHORIZED=0"
decision = "block"
reason   = "[ghostkit] This disables TLS certificate verification. Refusing during training."
